<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ARLEY RUSH</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:Arial;touch-action:none}#ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px;z-index:10}.b{background:#000b;border:2px solid #D4AF37;border-radius:22px;padding:6px 14px;font-weight:900;color:#D4AF37;box-shadow:0 0 12px #D4AF3788}.b span{color:#00D4FF}canvas{display:block;margin:44px auto 0 auto;background:#020a12}#menu{position:fixed;inset:0;background:radial-gradient(ellipse,#112233,#000);display:flex;align-items:center;justify-content:center;z-index:20}.card{background:#0a141ef5;border:2px solid #D4AF37;border-radius:28px;padding:20px;width:92%;max-width:360px;text-align:center;box-shadow:0 0 50px #D4AF3766,0 0 30px #00D4FF44 inset}.logo{width:170px;height:170px;border-radius:50%;margin:0 auto 8px;display:block;border:3px solid #D4AF37;box-shadow:0 0 30px #D4AF37,0 0 20px #00D4FF}h1{color:#D4AF37;letter-spacing:5px;text-shadow:0 0 12px #D4AF37}h1 span{color:#00D4FF;text-shadow:0 0 12px #00D4FF}.btn{background:linear-gradient(90deg,#D4AF37,#FFD700);color:#000;border:0;border-radius:30px;padding:14px;width:100%;font-weight:900;font-size:19px;box-shadow:0 0 20px #D4AF37aa}</style></head><body><div id="ui"><div class="b">🏁 <span id="d">0</span>m</div><div class="b">💰 <span id="c1">0</span> • <span id="s1">0</span></div></div><canvas id="cv" width="360" height="680"></canvas><div id="menu"><div class="card"><img class="logo" src="https://i.imgur.com/8Km9tLL.png" onerror="this.style.background='radial-gradient(circle,#D4AF37,#000)'"><h1>ARLEY <span>RUSH</span></h1><p style="color:#00D4FF;font-size:10px;letter-spacing:3px;margin:6px 0">LOGO COLORS • GOLD + BLUE + BLACK</p><button class="btn" id="pb">🏁 PLAY NOW</button><p style="color:#666;font-size:10px;margin-top:8px">Swipe to move • Your colors: Gold & Electric Blue</p></div></div><script>
const C=document.getElementById('cv'),X=C.getContext('2d'),W=360,H=680,L=[50,170,290];let p={lane:1,x:170,tx:170,y:540},O=[],G=[],D=0,CC=0,SP=8,F=0,R=0,N=0;
function car(x,y,isP,blur){X.save();X.translate(x+20,y+35);if(isP&&blur>0){X.globalAlpha=0.28;X.fillStyle='#00D4FF';X.beginPath();X.ellipse(-blur*1.2,0,24,38,0,0,6.28);X.fill();X.globalAlpha=1}X.shadowColor=isP?'#00D4FF':'#ff3333';X.shadowBlur=isP?24:10;X.strokeStyle=isP?'#D4AF37':'#ff6666';X.lineWidth=2.8;X.beginPath();X.ellipse(0,0,21,33,0,0,6.28);X.stroke();X.shadowBlur=0;X.strokeStyle='#D4AF37';X.lineWidth=1.2;X.beginPath();X.ellipse(0,0,18,29,0,0,6.28);X.stroke();X.fillStyle='#040a12';X.beginPath();X.ellipse(0,0,15,24,0,0,6.28);X.fill();if(isP){X.shadowColor='#00D4FF';X.shadowBlur=14;X.strokeStyle='#00D4FF';X.lineWidth=2;X.beginPath();X.ellipse(0,0,11,17,0,0,6.28);X.stroke();X.shadowBlur=0;X.fillStyle='#D4AF37';X.font='900 14px Arial';X.textAlign='center';X.fillText('AR',0,5)}X.restore()}
function coin(x,y){X.save();X.translate(x,y);X.shadowColor='#D4AF37';X.shadowBlur=16;X.fillStyle='#D4AF37';X.beginPath();X.arc(0,0,11,0,6.28);X.fill();X.shadowBlur=0;X.fillStyle='#000';X.font='900 12px Arial';X.textAlign='center';X.fillText('$',0,4);X.restore()}
function rst(){O=[];G=[];D=0;CC=0;SP=8;F=0;N=0;p.lane=1;p.x=L[1];p.tx=L[1]}
function go(){rst();document.getElementById('menu').style.display='none';R=1;requestAnimationFrame(lp)}
function over(){R=0;document.getElementById('menu').style.display='flex';document.querySelector('h1').innerHTML='WRECKED!';document.getElementById('pb').innerText='🔁 AGAIN'}
function lp(){if(!R)return;requestAnimationFrame(lp);F++;D+=SP*0.12;if(F%110==0)SP=Math.min(20,SP+0.35);if(N>0)N--;let cur=N>0?SP+9:SP,blur=N>0?7:Math.max(0,(SP-12)/2);X.fillStyle='rgba(2,10,18,0.88)';X.fillRect(0,0,W,H);X.strokeStyle='rgba(0,212,255,0.22)';X.lineWidth=2;X.setLineDash([24,24]);X.beginPath();X.moveTo(120,0);X.lineTo(120,H);X.moveTo(240,0);X.lineTo(240,H);X.stroke();X.setLineDash([]);X.fillStyle='rgba(212,175,55,0.18)';for(let i=0;i<H;i+=45){let yy=(i+F*cur*1.2)%H;X.fillRect(178,yy,3,17)}p.x+=(p.tx-p.x)*0.24;car(p.x,p.y,1,blur);if(F%Math.max(14,42-Math.floor(SP))==0){O.push({lane:Math.floor(Math.random()*3),x:L[Math.floor(Math.random()*3)],y:-100})}for(let i=O.length-1;i>=0;i--){let o=O[i];o.y+=cur;car(o.x,o.y,0,0);if(o.y>H+50){O.splice(i,1);continue}if(o.y+62>p.y&&o.y<p.y+62&&o.lane==p.lane)return over()}if(F%27==0)G.push({x:L[Math.floor(Math.random()*3)]+20,y:-20});for(let i=G.length-1;i>=0;i--){let g=G[i];g.y+=cur;coin(g.x,g.y);if(g.y>H+30){G.splice(i,1);continue}if(Math.abs(g.x-(p.x+20))<24&&Math.abs(g.y-(p.y+35))<38){G.splice(i,1);CC++;if(CC%5==0)N=85}}document.getElementById('d').innerText=Math.floor(D);document.getElementById('c1').innerText=CC;document.getElementById('s1').innerText=Math.floor(cur*14)}
let sx=0;C.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});C.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(dx>30&&p.lane<2){p.lane++;p.tx=L[p.lane]}if(dx<-30&&p.lane>0){p.lane--;p.tx=L[p.lane]}},{passive:true});document.getElementById('pb').addEventListener('click',go);
</script></body></html>

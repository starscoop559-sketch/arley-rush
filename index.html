<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ARLEY RUSH</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020508;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  max-width:420px;
  margin:auto;
  background:#050a0e;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  max-width:400px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  z-index:5;
  pointer-events:none;
}

.pill{
  background:rgba(2,7,11,.88);
  border:1px solid rgba(255,215,0,.7);
  border-radius:18px;
  padding:7px 11px;
  color:white;
  font-size:11px;
  font-weight:900;
}

.gold{color:#ffd700}
.blue{color:#00e5ff}
.red{color:#ff3948}

#menu{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at center,#162b38,#020508 70%);
  z-index:20;
  padding:20px;
}

.box{
  width:min(340px,92%);
  padding:25px;
  text-align:center;
  border:1px solid #8f7700;
  border-radius:25px;
  background:#071019;
}

.logo{
  width:85px;
  height:85px;
  margin:auto auto 14px;
  border-radius:50%;
  border:2px solid #ffd700;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffd700;
  font-size:27px;
  font-weight:1000;
  background:radial-gradient(circle,#243844,#030608 70%);
}

h1{
  color:#ffd700;
  letter-spacing:4px;
  font-size:28px;
}

h1 span{
  color:#00e5ff;
}

.sub{
  color:#00e5ff;
  font-size:9px;
  letter-spacing:3px;
  margin:7px 0 18px;
}

button{
  width:100%;
  border:0;
  border-radius:30px;
  padding:15px;
  background:#ffd000;
  color:#080808;
  font-weight:1000;
  font-size:17px;
}

.info{
  color:#71838e;
  font-size:10px;
  line-height:1.6;
  margin-top:12px;
}
</style>
</head>

<body>

<div id="hud">
  <div class="pill">
    🏁 <span class="gold" id="distance">0</span>m
  </div>

  <div class="pill">
    💰 <span class="gold" id="coins">0</span>
    &nbsp; ⚡ <span class="blue" id="speed">0</span>
  </div>
</div>

<canvas id="game"></canvas>

<div id="menu">
  <div class="box">
    <div class="logo">AR</div>

    <h1>ARLEY <span>RUSH</span></h1>

    <div class="sub">STREET RACING</div>

    <button id="play">🏁 START RACE</button>

    <div class="info">
      SWIPE LEFT / RIGHT TO STEER<br>
      Collect coins • Dodge traffic • Build your combo
    </div>
  </div>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false});

let W=390;
let H=760;
let scale=1;

function resize(){

  const dpr=Math.min(window.devicePixelRatio||1,1.5);

  W=Math.min(window.innerWidth,420);
  H=window.innerHeight;

  canvas.width=Math.floor(W*dpr);
  canvas.height=Math.floor(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  scale=dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
window.addEventListener("resize",resize);


/* GAME STATE */

const lanes=[0,1,2];

let player={
  lane:1,
  x:1,
  y:0
};

let traffic=[];
let coins=[];
let particles=[];

let running=false;
let frame=0;

let distance=0;
let money=0;
let speed=7;

let combo=1;
let comboTimer=0;

let nitro=0;
let lives=3;

let best=Number(localStorage.getItem("arleyRushBest")||0);


/* HELPERS */

function laneX(lane,y){

  const horizon=H*0.28;

  const roadBottom=W*0.86;
  const roadTop=W*0.26;

  const p=Math.max(0,Math.min(1,(y-horizon)/(H-horizon)));

  const roadWidth=roadTop+(roadBottom-roadTop)*p;

  return W/2+(lane-1)*(roadWidth/3);
}


function roundedRect(x,y,w,h,r){

  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}


/* ROAD */

function drawRoad(){

  ctx.fillStyle="#061018";
  ctx.fillRect(0,0,W,H);

  /* sky */

  const sky=ctx.createLinearGradient(0,0,0,H*.35);

  sky.addColorStop(0,"#02060a");
  sky.addColorStop(1,"#17303d");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H*.35);


  /* distant lights */

  ctx.fillStyle="#b9d5df";

  for(let i=0;i<9;i++){

    const y=H*.17+i*13;

    ctx.fillRect(20+i*8,y,2,2);
    ctx.fillRect(W-20-i*8,y,2,2);
  }


  /* road */

  ctx.fillStyle="#111a20";

  ctx.beginPath();

  ctx.moveTo(W*.37,H*.28);
  ctx.lineTo(W*.63,H*.28);
  ctx.lineTo(W*.93,H);
  ctx.lineTo(W*.07,H);

  ctx.closePath();
  ctx.fill();


  /* road edges */

  ctx.strokeStyle="rgba(255,215,0,.45)";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(W*.37,H*.28);
  ctx.lineTo(W*.07,H);

  ctx.moveTo(W*.63,H*.28);
  ctx.lineTo(W*.93,H);

  ctx.stroke();


  /* lane markers */

  const offset=(frame*speed*1.5)%65;

  ctx.fillStyle="rgba(210,225,230,.55)";

  for(let y=-65+offset;y<H;y+=65){

    const p=Math.max(0,(y-H*.28)/(H*.72));

    const width=W*(.26+.60*p);

    const left=W/2-width/2;

    ctx.fillRect(left+width/3,y,3,28);
    ctx.fillRect(left+width*2/3,y,3,28);
  }
}


/* REALISTIC LIGHTWEIGHT CAR */

function drawCar(cx,cy,s,playerCar){

  ctx.save();

  ctx.translate(cx,cy);
  ctx.scale(s,s);


  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.55)";

  ctx.beginPath();
  ctx.ellipse(0,38,30,8,0,0,Math.PI*2);
  ctx.fill();


  /* wheels */

  ctx.fillStyle="#030405";

  ctx.beginPath();
  ctx.ellipse(-24,22,7,15,0,0,Math.PI*2);
  ctx.ellipse(24,22,7,15,0,0,Math.PI*2);
  ctx.fill();


  /* body */

  const body=ctx.createLinearGradient(-30,0,30,0);

  if(playerCar){

    body.addColorStop(0,"#765500");
    body.addColorStop(.25,"#e6b800");
    body.addColorStop(.5,"#fff0a0");
    body.addColorStop(.72,"#dca900");
    body.addColorStop(1,"#614500");

  }else{

    body.addColorStop(0,"#252c31");
    body.addColorStop(.3,"#89949b");
    body.addColorStop(.5,"#e2e7e9");
    body.addColorStop(.75,"#626c72");
    body.addColorStop(1,"#202529");
  }

  ctx.fillStyle=body;

  ctx.beginPath();

  ctx.moveTo(-26,38);
  ctx.quadraticCurveTo(-31,22,-27,2);
  ctx.lineTo(-22,-29);
  ctx.quadraticCurveTo(-17,-46,0,-50);
  ctx.quadraticCurveTo(17,-46,22,-29);
  ctx.lineTo(27,2);
  ctx.quadraticCurveTo(31,22,26,38);
  ctx.quadraticCurveTo(0,47,-26,38);

  ctx.closePath();
  ctx.fill();


  /* cockpit */

  const glass=ctx.createLinearGradient(0,-45,0,-5);

  glass.addColorStop(0,"#071017");
  glass.addColorStop(.5,"#315361");
  glass.addColorStop(1,"#081116");

  ctx.fillStyle=glass;

  ctx.beginPath();

  ctx.moveTo(-17,-30);
  ctx.quadraticCurveTo(0,-46,17,-30);
  ctx.lineTo(13,-7);
  ctx.quadraticCurveTo(0,-2,-13,-7);

  ctx.closePath();
  ctx.fill();


  /* windshield reflection */

  ctx.fillStyle="rgba(255,255,255,.22)";

  ctx.beginPath();
  ctx.moveTo(-13,-29);
  ctx.lineTo(-5,-9);
  ctx.lineTo(-9,-10);
  ctx.closePath();
  ctx.fill();


  /* hood highlight */

  ctx.fillStyle="rgba(255,255,255,.18)";

  ctx.beginPath();
  ctx.moveTo(-9,-5);
  ctx.lineTo(-2,-8);
  ctx.lineTo(-2,25);
  ctx.lineTo(-10,20);

  ctx.closePath();
  ctx.fill();


  /* headlights */

  ctx.fillStyle="#eafcff";

  roundedRect(-19,-35,12,5,2);
  ctx.fill();

  roundedRect(7,-35,12,5,2);
  ctx.fill();


  /* front grille */

  ctx.fillStyle="#050708";

  ctx.beginPath();

  ctx.moveTo(-12,29);
  ctx.quadraticCurveTo(0,37,12,29);
  ctx.lineTo(8,35);
  ctx.quadraticCurveTo(0,39,-8,35);

  ctx.closePath();
  ctx.fill();


  /* side intakes */

  ctx.fillStyle="#090c0e";

  ctx.fillRect(-28,10,6,18);
  ctx.fillRect(22,10,6,18);


  if(playerCar){

    ctx.fillStyle="#fff0a0";
    ctx.font="bold 6px Arial";
    ctx.textAlign="center";
    ctx.fillText("ARLEY",0,20);

  }else{

    /* rear lights */

    ctx.fillStyle="#ff2635";

    ctx.fillRect(-19,31,10,4);
    ctx.fillRect(9,31,10,4);
  }


  ctx.restore();
}


/* COIN */

function drawCoin(cx,cy){

  ctx.fillStyle="#ffd700";

  ctx.beginPath();
  ctx.arc(cx,cy,9,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#795900";

  ctx.font="bold 11px Arial";
  ctx.textAlign="center";

  ctx.fillText("$",cx,cy+4);
}


/* RESET */

function reset(){

  traffic.length=0;
  coins.length=0;
  particles.length=0;

  frame=0;
  distance=0;
  money=0;
  speed=7;

  combo=1;
  comboTimer=0;

  nitro=0;
  lives=3;

  player.lane=1;
  player.x=1;

}


/* START */

function start(){

  reset();

  document.getElementById("menu").style.display="none";

  running=true;

  requestAnimationFrame(loop);
}


/* GAME OVER */

function gameOver(){

  running=false;

  if(distance>best){

    best=Math.floor(distance);

    localStorage.setItem("arleyRushBest",best);
  }

  const menu=document.getElementById("menu");

  menu.style.display="flex";

  menu.querySelector("h1").innerHTML=
    'RACE <span>OVER</span>';

  menu.querySelector(".sub").textContent=
    Math.floor(distance)+"M  •  "+money+" COINS";

  document.getElementById("play").textContent="🔁 RACE AGAIN";
}


/* SPAWN TRAFFIC */

function spawnTraffic(){

  if(traffic.length>=4)return;

  const lane=Math.floor(Math.random()*3);

  /* prevent immediate impossible overlap */

  for(const car of traffic){

    if(car.lane===lane && car.y<160)return;
  }

  traffic.push({
    lane,
    y:H*.25-100,
    passed:false
  });
}


/* SPAWN COIN */

function spawnCoin(){

  if(coins.length>=5)return;

  const lane=Math.floor(Math.random()*3);

  coins.push({
    lane,
    y:H*.25-30
  });
}


/* MAIN LOOP */

let lastTime=0;

function loop(time){

  if(!running)return;

  requestAnimationFrame(loop);

  if(!lastTime)lastTime=time;

  const dt=Math.min((time-lastTime)/16.67,1.5);

  lastTime=time;

  frame++;

  /* difficulty */

  speed=Math.min(15,7+distance/1800);

  if(nitro>0){

    nitro--;

  }


  const currentSpeed=
    speed+(nitro>0?7:0);


  distance+=currentSpeed*.11*dt;


  /* road */

  drawRoad();


  /* traffic spawn */

  if(frame%Math.max(32,65-Math.floor(speed*2))===0){

    spawnTraffic();
  }


  if(frame%42===0){

    spawnCoin();
  }


  /* player movement */

  const targetX=laneX(player.x,H*.82);

  const playerCenter=targetX;

  /* traffic */

  for(let i=traffic.length-1;i>=0;i--){

    const car=traffic[i];

    car.y+=currentSpeed*dt*1.18;

    const cx=laneX(car.lane,car.y);

    const perspective=.62+
      Math.max(0,Math.min(1,
      (car.y-H*.28)/(H*.72)))*.38;

    drawCar(cx,car.y,perspective,false);


    /* collision */

    if(
      car.lane===player.lane &&
      Math.abs(car.y-H*.82)<65
    ){

      lives--;

      traffic.splice(i,1);

      combo=1;

      if(lives<=0){

        gameOver();
        return;
      }
    }


    /* near miss */

    if(
      !car.passed &&
      car.y>H*.82+55
    ){

      car.passed=true;

      combo=Math.min(combo+1,5);
      comboTimer=100;
    }


    if(car.y>H+100){

      traffic.splice(i,1);
    }
  }


  /* coins */

  for(let i=coins.length-1;i>=0;i--){

    const coin=coins[i];

    coin.y+=currentSpeed*dt*1.2;

    const cx=laneX(coin.lane,coin.y);

    drawCoin(cx,coin.y);


    if(
      coin.lane===player.lane &&
      Math.abs(coin.y-H*.82)<55
    ){

      money+=combo;

      nitro=Math.min(nitro+20,100);

      combo=Math.min(combo+1,5);

      comboTimer=100;

      coins.splice(i,1);

      continue;
    }


    if(coin.y>H+50){

      coins.splice(i,1);
    }
  }


  /* combo timer */

  if(comboTimer>0){

    comboTimer--;

  }else{

    combo=1;
  }


  /* player */

  drawCar(
    playerCenter,
    H*.82,
    1.05,
    true
  );


  /* HUD */

  document.getElementById("distance").textContent=
    Math.floor(distance);

  document.getElementById("coins").textContent=
    money;

  document.getElementById("speed").textContent=
    Math.floor(currentSpeed*18);


  /* combo */

  if(combo>1){

    ctx.fillStyle="#ffd700";
    ctx.font="900 18px Arial";
    ctx.textAlign="center";

    ctx.fillText(
      "x"+combo+" COMBO",
      W/2,
      H*.15
    );
  }


  /* nitro */

  if(nitro>0){

    ctx.fillStyle="#00e5ff";
    ctx.font="900 12px Arial";
    ctx.textAlign="center";

    ctx.fillText(
      "⚡ NITRO",
      W/2,
      H*.18
    );
  }


  /* lives */

  ctx.fillStyle="#ff3948";
  ctx.font="bold 12px Arial";
  ctx.textAlign="left";

  ctx.fillText(
    "♥".repeat(lives),
    12,
    H-18
  );

}


/* SWIPE CONTROL */

let startX=0;

canvas.addEventListener(
  "touchstart",
  e=>{
    startX=e.touches[0].clientX;
  },
  {passive:true}
);


canvas.addEventListener(
  "touchend",
  e=>{

    if(!running)return;

    const dx=
      e.changedTouches[0].clientX-startX;

    if(dx>35 && player.lane<2){

      player.lane++;
    }

    if(dx<-35 && player.lane>0){

      player.lane--;
    }

    player.x=player.lane;

  },
  {passive:true}
);


/* START BUTTON */

document
  .getElementById("play")
  .addEventListener("click",start);

</script>

</body>
  </html>

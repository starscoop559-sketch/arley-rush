<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARLEY RUSH - Ultimate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial, sans-serif;overflow:hidden;touch-action:none}
#ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px;z-index:10}
.badge{background:rgba(0,0,0,0.7);border:2px solid #00e5ff;border-radius:24px;padding:7px 16px;font-weight:900;font-size:13px;color:#ffe45c;box-shadow:0 0 15px #00e5ff55}
canvas{display:block;margin:44px auto 0 auto;background:#020a12}
#menu{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0f2535 0%,#000 80%);display:flex;align-items:center;justify-content:center;z-index:20}
.card{background:rgba(14,24,36,0.96);border:2px solid #00e5ff;border-radius:28px;padding:20px;text-align:center;width:92%;max-width:360px;box-shadow:0 0 60px #00e5ff66}
.logo{width:165px;height:165px;border-radius:50%;display:block;margin:0 auto 10px auto;box-shadow:0 0 30px #00e5ff,0 0 60px #ffe45c44;object-fit:cover;background:#001a22}
h1{color:#ffe45c;font-size:28px;letter-spacing:5px;text-shadow:0 0 12px #ffe45c}
h1 span{color:#00e5ff;text-shadow:0 0 12px #00e5ff}
.sub{color:#7ecbff;font-size:10px;letter-spacing:3px;margin:8px 0}
.btn{background:linear-gradient(90deg,#ffe45c,#ff9d00);color:#000;border:0;border-radius:32px;padding:15px;width:100%;font-weight:900;font-size:19px;letter-spacing:1px;box-shadow:0 0 25px #ffe45c88}
.how{color:#5a7a8a;font-size:11px;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<div id="ui">
<div class="badge">🏁 <span id="dist">0</span>m</div>
<div class="badge">💰 <span id="coins">0</span> • <span id="speed">0</span> KMH</div>
</div>
<canvas id="c" width="360" height="680"></canvas>

<div id="menu">
<div class="card">
<img class="logo" src="https://i.imgur.com/8Km9tLL.png" onerror="this.src='https://via.placeholder.com/165/001a22/00e5ff?text=AR'">
<h1>ARLEY <span>RUSH</span></h1>
<div class="sub">ULTIMATE EDITION • NFS x BLUR</div>
<button class="btn" id="playBtn">🏁 PLAY NOW</button>
<div class="how">Swipe left/right to dodge<br>Collect gold • Feel the blur<br>Not on Telegram yet - Exclusive</div>
</div>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 360, H = 680;
const lanesX = [50, 170, 290];
let player = {lane:1, x:170, y:540, tx:170};
let obstacles = [];
let coinList = [];
let particles = [];
let distance = 0;
let coinCount = 0;
let gameSpeed = 8;
let frame = 0;
let running = false;
let nitro = 0;

function drawArCar(x,y,isPlayer,blur){
  ctx.save();
  ctx.translate(x+20, y+35);
  if(blur>0 && isPlayer){
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath();
    ctx.ellipse(-blur*1.5, 2, 22, 36, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.shadowColor = isPlayer? '#00e5ff' : '#ff3a3a';
  ctx.shadowBlur = isPlayer? 22 : 14;
  ctx.strokeStyle = isPlayer? '#7defff' : '#ff7a7a';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(-19,-33); ctx.lineTo(-19,29); ctx.lineTo(-12,34); ctx.lineTo(12,34); ctx.lineTo(19,29); ctx.lineTo(19,-33); ctx.lineTo(12,-37); ctx.lineTo(-12,-37);
  ctx.closePath(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#05131c';
  ctx.beginPath();
  ctx.ellipse(0, 0, 15, 19, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = isPlayer? '#00e5ff' : '#555';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  if(isPlayer){
    ctx.fillStyle = '#ffe45c';
    ctx.font = '900 15px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ffe45c';
    ctx.shadowBlur = 12;
    ctx.fillText('AR', 0, 6);
    ctx.shadowBlur = 0;
  }
  ctx.fillStyle = isPlayer? '#aaffff' : '#ffaaaa';
  ctx.beginPath(); ctx.arc(-11.5,-33,3.5,0,Math.PI*2); ctx.arc(11.5,-33,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff1a1a';
  ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 10;
  ctx.fillRect(-16,28,6,5); ctx.fillRect(10,28,6,5);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawCoin(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.shadowColor = '#ffe45c'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#ffde59';
  ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#8a6d00'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = '#000'; ctx.font = '900 12px Arial'; ctx.textAlign = 'center';
  ctx.fillText('$',0,4.5);
  ctx.restore();
}

function resetGame(){
  obstacles = []; coinList = []; particles = [];
  distance = 0; coinCount = 0; gameSpeed = 8; frame = 0; nitro = 0;
  player.lane = 1; player.x = lanesX[1]; player.tx = lanesX[1];
}

function startGame(){
  resetGame();
  document.getElementById('menu').style.display = 'none';
  running = true;
  requestAnimationFrame(gameLoop);
}

function gameOver(){
  running = false;
  document.getElementById('menu').style.display = 'flex';
  document.querySelector('.card h1').innerHTML = 'WRECKED!';
  document.querySelector('.sub').innerText = Math.floor(distance)+'m • '+coinCount+' coins collected';
  document.getElementById('playBtn').innerText = '🔁 TRY AGAIN';
}

function gameLoop(){
  if(!running) return;
  requestAnimationFrame(gameLoop);
  frame++;
  distance += gameSpeed * 0.11;
  if(frame % 120 === 0) gameSpeed = Math.min(22, gameSpeed + 0.3);
  if(nitro > 0) nitro--;

  let currentSpeed = nitro > 0? gameSpeed + 8 : gameSpeed;
  let blur = nitro > 0? 6 : Math.max(0, (gameSpeed-12)/2);

  ctx.fillStyle = 'rgba(2,10,18,0.85)';
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(0,229,255,0.18)';
  ctx.lineWidth = 2;
  ctx.setLineDash([26,26]);
  ctx.beginPath();
  ctx.moveTo(120,0); ctx.lineTo(120,H);
  ctx.moveTo(240,0); ctx.lineTo(240,H);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  for(let i=0;i<H;i+=44){
    let yy = (i + frame * currentSpeed * 1.3) % H;
    ctx.fillRect(178, yy, 3, 18);
  }

  player.x += (player.tx - player.x) * 0.24;
  drawArCar(player.x, player.y, true, blur);

  if(frame % Math.max(14, 45 - Math.floor(gameSpeed)) === 0){
    let ln = Math.floor(Math.random()*3);
    obstacles.push({lane:ln, x:lanesX[ln], y:-100});
  }
  for(let i=obstacles.length-1;i>=0;i--){
    let o = obstacles[i];
    o.y += currentSpeed;
    drawArCar(o.x, o.y, false, 0);
    if(o.y > H+50){ obstacles.splice(i,1); continue; }
    if(o.y+62 > player.y && o.y < player.y+60 && o.lane === player.lane){
      return gameOver();
    }
  }

  if(frame % 28 === 0){
    let ln = Math.floor(Math.random()*3);
    coinList.push({x:lanesX[ln]+20, y:-20});
  }
  for(let i=coinList.length-1;i>=0;i--){
    let c = coinList[i];
    c.y += currentSpeed;
    drawCoin(c.x, c.y);
    if(c.y > H+30){ coinList.splice(i,1); continue; }
    if(Math.abs(c.x-(player.x+20)) < 24 && Math.abs(c.y-(player.y+35)) < 38){
      coinList.splice(i,1);
      coinCount++;
      if(coinCount % 5 === 0) nitro = 90;
      for(let k=0;k<5;k++) particles.push({x:c.x, y:c.y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, life:18});
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.fillStyle = '#ffe45c';
    ctx.fillRect(p.x, p.y, 3, 3);
    if(p.life <= 0) particles.splice(i,1);
  }

  document.getElementById('dist').innerText = Math.floor(distance);
  document.getElementById('coins').innerText = coinCount;
  document.getElementById('speed').innerText = Math.floor(currentSpeed*14);
}

let startX = 0;
cv.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
cv.addEventListener('touchend', e => {
  let dx = e.changedTouches[0].clientX - startX;
  if(dx > 30 && player.lane < 2){ player.lane++; player.tx = lanesX[player.lane]; }
  if(dx < -30 && player.lane > 0){ player.lane--; player.tx = lanesX[player.lane]; }
}, {passive:true});

document.getElementById('playBtn').addEventListener('click', startGame);
cv.addEventListener('click', e => {
  let rect = cv.getBoundingClientRect();
  let x = e.clientX - rect.left;
  if(x < 120 && player.lane > 0){ player.lane--; player.tx = lanesX[player.lane]; }
  else if(x > 240 && player.lane < 2){ player.lane++; player.tx = lanesX[player.lane]; }
});
</script>
</body>
  </html>

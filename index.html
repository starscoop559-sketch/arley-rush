<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>ARLEY RUSH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;overflow:hidden;font-family:system-ui;color:white;touch-action:none}
#game{position:absolute;top:0;left:0;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;padding:12px;display:flex;justify-content:space-between;z-index:10;font-weight:900}
#ui div{background:rgba(0,0,0,0.7);padding:8px 14px;border-radius:20px;border:1px solid #ffd700}
#start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;background:rgba(10,10,15,0.95);padding:30px;border-radius:24px;border:2px solid #ffd700;width:85%;max-width:320px}
#start h1{font-size:32px;color:#ffd700;letter-spacing:2px}
#start p{margin:12px 0;color:#aaa}
button{background:#ffd700;color:black;border:0;padding:14px 28px;border-radius:30px;font-weight:900;font-size:18px;width:100%;margin-top:10px}
#over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;background:rgba(10,10,15,0.95);padding:30px;border-radius:24px;border:2px solid #ff4444;width:85%;max-width:320px;display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div>🏁 <span id="score">0</span></div><div>💰 <span id="coins">0</span></div></div>
<div id="start">
<h1>ARLEY RUSH</h1>
<p>One road. No second chances.</p>
<p style="font-size:13px">◀️ SWIPE LEFT/RIGHT TO DODGE ▶️</p>
<button onclick="startGame()">🏁 PLAY</button>
<p style="font-size:11px;margin-top:10px;opacity:0.5">@arleyrush_game_bot</p>
</div>
<div id="over">
<h1 style="color:#ff4444">WRECKED!</h1>
<p>Score: <span id="finalScore">0</span></p>
<p>Coins: <span id="finalCoins">0</span></p>
<button onclick="startGame()">🔄 RACE AGAIN</button>
<button onclick="shareScore()" style="background:white;margin-top:8px">📤 SHARE SCORE</button>
</div>
<script>
const tg = window.Telegram?.WebApp; if(tg){tg.ready(); tg.expand();}
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H, lanes=3, laneW, player={lane:1,y:0}, enemies=[], coinObjs=[], score=0, coins=0, speed=5, running=false, anim;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;laneW=W/lanes;if(player)player.y=H-130;}
window.addEventListener('resize',resize);resize();
let startX=0;
canvas.addEventListener('touchstart',e=>{startX=e.touches[0].clientX});
canvas.addEventListener('touchend',e=>{
 if(!running)return;
 let dx=e.changedTouches[0].clientX-startX;
 if(Math.abs(dx)>30){if(dx>0&&player.lane<lanes-1){player.lane++; tg?.HapticFeedback.impactOccurred('light');}else if(dx<0&&player.lane>0){player.lane--; tg?.HapticFeedback.impactOccurred('light');}}
});
canvas.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&player.lane>0)player.lane--;if(e.key==='ArrowRight'&&player.lane<lanes-1)player.lane++;});
function startGame(){
 document.getElementById('start').style.display='none';document.getElementById('over').style.display='none';
 enemies=[];coinObjs=[];score=0;coins=0;speed=5;player.lane=1;running=true;
 loop();
}
function spawn(){
 if(Math.random()<0.03){
  let lane=Math.floor(Math.random()*lanes);
  enemies.push({lane,y:-100,w:laneW*0.6,h:90,color:Math.random()>0.5?'#ff4444':'#4444ff'});
 }
 if(Math.random()<0.02){
  let lane=Math.floor(Math.random()*lanes);
  coinObjs.push({lane,y:-50,r:14});
 }
}
function loop(){
 if(!running)return;
 ctx.fillStyle='#1a1a1f';ctx.fillRect(0,0,W,H);
 // road lines
 ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.setLineDash([20,20]);
 for(let i=1;i<lanes;i++){ctx.beginPath();ctx.moveTo(i*laneW,0);ctx.lineTo(i*laneW,H);ctx.stroke();}
 ctx.setLineDash([]);
 // player
 let px=player.lane*laneW+laneW/2, py=player.y;
 ctx.fillStyle='#ffd700';ctx.fillRect(px-25,py,50,90);ctx.fillStyle='black';ctx.fillRect(px-20,py+10,40,15);
 // enemies
 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i];e.y+=speed;
  let ex=e.lane*laneW+laneW/2-e.w/2;
  ctx.fillStyle=e.color;ctx.fillRect(ex,e.y,e.w,e.h);
  if(e.y>H){enemies.splice(i,1);score+=10;continue;}
  if(Math.abs(e.lane-player.lane)<0.1&&e.y+ e.h>py&&e.y<py+90){gameOver();return;}
 }
 // coins
 for(let i=coinObjs.length-1;i>=0;i--){
  let c=coinObjs[i];c.y+=speed;
  let cx=c.lane*laneW+laneW/2;
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(cx,c.y,c.r,0,Math.PI*2);ctx.fill();
  if(c.y>H)coinObjs.splice(i,1);
  else if(c.lane===player.lane&&Math.abs(c.y-py-45)<50){coins++;coinObjs.splice(i,1);score+=25;tg?.HapticFeedback.notificationOccurred('success');}
 }
 document.getElementById('score').innerText=score;document.getElementById('coins').innerText=coins;
 spawn();speed+=0.003;anim=requestAnimationFrame(loop);
}
function gameOver(){
 running=false;cancelAnimationFrame(anim);
 document.getElementById('finalScore').innerText=score;
 document.getElementById('finalCoins').innerText=coins;
 document.getElementById('over').style.display='block';
 tg?.HapticFeedback.notificationOccurred('error');
 let best=localStorage.getItem('ar_best')||0;if(score>best)localStorage.setItem('ar_best',score);
}
function shareScore(){
 if(tg){tg.switchInlineQuery(`🏁 I scored ${score} in ARLEY RUSH! Can you beat me?`,[]);}
 else{navigator.clipboard.writeText(`🏁 I scored ${score} in ARLEY RUSH! @arleyrush_game_bot`);alert('Score copied!');}
}
</script>
</body>
  </html>
